name: Build Installers

on:
  release:
    types: [ published ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Build Windows Installer with Velopack
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}"
        # Handle branch names vs tags
        if ($version -eq "develop" -or $version -eq "refs/heads/develop" -or $version.StartsWith("refs/heads/")) {
          $version = "0.0.0-preview"
        }
        ./scripts/packaging/build-windows-installer.ps1 -Version $version
      env:
        VERSION: ${{ github.ref_name }}

    - name: Upload Windows Installer
      uses: actions/upload-artifact@v4
      with:
        name: xtreamium-proxy-windows-installer
        path: publish/packages/*.exe

  build-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Publish Linux
      run: dotnet publish xtreamium-proxy.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o ./publish/linux

    - name: Remove Development Configuration
      run: rm -f ./publish/linux/appsettings.Development.json

    - name: Install nfpm
      run: |
        NFPM_VERSION="2.43.4"
        wget -qO /tmp/nfpm.tar.gz "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
        sudo tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm
        sudo chmod +x /usr/local/bin/nfpm
        nfpm --version
      shell: bash

    - name: Stage Linux release artifacts
      run: |
        # User systemd unit — shipped at /usr/lib/systemd/user/xtreamium-proxy.service
        # by the distro packages, also bundled in the tarball for AUR consumption.
        cat > ./publish/linux/xtreamium-proxy.service << 'EOF'
        [Unit]
        Description=Xtreamium Proxy Service
        Documentation=https://github.com/xtreamium/xtreamium-proxy
        After=network-online.target
        Wants=network-online.target

        [Service]
        Type=notify
        ExecStart=/usr/bin/xtreamium-proxy
        Restart=on-failure
        RestartSec=5
        Environment=ASPNETCORE_ENVIRONMENT=Production
        Environment=DOTNET_PRINT_TELEMETRY_MESSAGE=false

        [Install]
        WantedBy=default.target
        EOF

        # Minimal README bundled into the tarball for AUR's makepkg source.
        cat > ./publish/linux/README.md << 'EOF'
        # Xtreamium Proxy

        Per-user systemd service. Install via your distro package
        (`pacman -S xtreamium-proxy`, `apt install ./xtreamium-proxy*.deb`,
        `rpm -i xtreamium-proxy*.rpm`), then:

        ```
        systemctl --user enable --now xtreamium-proxy
        ```

        Config is created at `~/.config/xtreamium-proxy/appsettings.json` on first
        run. A reference template is installed to
        `/usr/share/xtreamium-proxy/appsettings.json.example`.
        EOF

        chmod +x ./publish/linux/xtreamium-proxy

    - name: Build Distribution Packages
      run: |
        cd scripts/packaging
        chmod +x build-packages.sh scripts/*.sh
        ./build-packages.sh
      env:
        VERSION: ${{ github.ref_name }}

    - name: Create Linux TAR package
      run: |
        cd ./publish/linux
        tar -czf ../../xtreamium-proxy-linux.tar.gz *

    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: xtreamium-proxy-linux
        path: ./xtreamium-proxy-linux.tar.gz

    - name: Upload DEB Package
      uses: actions/upload-artifact@v4
      with:
        name: xtreamium-proxy-deb
        path: ./publish/packages/*.deb

    - name: Upload RPM Package
      uses: actions/upload-artifact@v4
      with:
        name: xtreamium-proxy-rpm
        path: ./publish/packages/*.rpm

    - name: Upload Arch Package
      uses: actions/upload-artifact@v4
      with:
        name: xtreamium-proxy-arch
        path: ./publish/packages/*.pkg.tar.zst

    - name: Push to AUR
      if: github.event_name == 'release' && !contains(github.ref_name, 'preview')
      run: |
        # Setup SSH for AUR
        mkdir -p ~/.ssh
        echo "${{ secrets.AUR_SSH_KEY }}" > ~/.ssh/aur
        chmod 600 ~/.ssh/aur
        
        # Configure SSH for AUR
        cat >> ~/.ssh/config << 'EOF'
        Host aur.archlinux.org
          IdentityFile ~/.ssh/aur
          User aur
          StrictHostKeyChecking no
          BatchMode yes
          IdentitiesOnly yes
        EOF
        
        chmod 600 ~/.ssh/config
        
        # Push to AUR
        cd scripts/packaging
        chmod +x push-to-aur.sh
        ./push-to-aur.sh
      env:
        VERSION: ${{ github.ref_name }}
        GIT_SSH_COMMAND: "ssh -o BatchMode=yes -o StrictHostKeyChecking=no"

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
    - name: Download Windows Installer
      uses: actions/download-artifact@v4
      with:
        name: xtreamium-proxy-windows-installer
        path: ./artifacts/windows

    - name: Download Linux Artifact
      uses: actions/download-artifact@v4
      with:
        name: xtreamium-proxy-linux
        path: ./artifacts/linux

    - name: Download DEB Package
      uses: actions/download-artifact@v4
      with:
        name: xtreamium-proxy-deb
        path: ./artifacts/deb

    - name: Download RPM Package
      uses: actions/download-artifact@v4
      with:
        name: xtreamium-proxy-rpm
        path: ./artifacts/rpm

    - name: Download Arch Package
      uses: actions/download-artifact@v4
      with:
        name: xtreamium-proxy-arch
        path: ./artifacts/arch

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ./artifacts/windows/*.exe
          ./artifacts/linux/*.tar.gz
          ./artifacts/deb/*.deb
          ./artifacts/rpm/*.rpm
          ./artifacts/arch/*.pkg.tar.zst
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
