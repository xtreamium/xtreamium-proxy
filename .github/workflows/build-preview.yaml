name: Build Installers

on:
  release:
    types: [ published ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Build Windows Installer with Velopack
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}"
        # Handle branch names vs tags
        if ($version -eq "develop" -or $version -eq "refs/heads/develop" -or $version.StartsWith("refs/heads/")) {
          $version = "0.0.0-preview"
        }
        ./scripts/packaging/build-windows-installer.ps1 -Version $version
      env:
        VERSION: ${{ github.ref_name }}

    - name: Upload Windows Installer
      uses: actions/upload-artifact@v4
      with:
        name: xtreamium-proxy-windows-installer
        path: publish/packages/*.exe

  build-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Publish Linux
      run: dotnet publish xtreamium-proxy.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o ./publish/linux

    - name: Remove Development Configuration
      run: rm -f ./publish/linux/appsettings.Development.json

    - name: Install nfpm
      run: |
        echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
        sudo apt update
        sudo apt install nfpm

    - name: Build Distribution Packages
      run: |
        cd scripts/packaging
        chmod +x build-packages.sh scripts/*.sh
        ./build-packages.sh
      env:
        VERSION: ${{ github.ref_name }}

    - name: Create Linux Installer
      run: |
        # Create systemd service file
        cat > ./publish/linux/xtreamium-proxy.service << 'EOF'
        [Unit]
        Description=Xtreamium Proxy Service
        After=network.target

        [Service]
        Type=notify
        ExecStart=/opt/xtreamium-proxy/xtreamium-proxy
        Restart=always
        RestartSec=5
        User=xtreamium
        Group=xtreamium
        WorkingDirectory=/opt/xtreamium-proxy
        Environment=ASPNETCORE_ENVIRONMENT=Production
        Environment=DOTNET_ROOT=/opt/xtreamium-proxy

        # Security settings
        NoNewPrivileges=true
        ProtectSystem=strict
        ProtectHome=true
        ReadWritePaths=/opt/xtreamium-proxy/data
        ReadWritePaths=/var/log/xtreamium-proxy

        [Install]
        WantedBy=multi-user.target
        EOF

        # Create user service file for autostart
        cat > ./publish/linux/xtreamium-proxy-user.service << 'EOF'
        [Unit]
        Description=Xtreamium Proxy Service (User)
        After=network.target

        [Service]
        Type=notify
        ExecStart=%h/.local/opt/xtreamium-proxy/xtreamium-proxy
        Restart=always
        RestartSec=5
        WorkingDirectory=%h/.local/opt/xtreamium-proxy
        Environment=ASPNETCORE_ENVIRONMENT=Production
        Environment=DOTNET_ROOT=%h/.local/opt/xtreamium-proxy

        [Install]
        WantedBy=default.target
        EOF

        # Create install script
        cat > ./publish/linux/install.sh << 'EOF'
        #!/bin/bash
        set -e

        INSTALL_DIR="/opt/xtreamium-proxy"
        USER_INSTALL_DIR="$HOME/.local/opt/xtreamium-proxy"
        SERVICE_NAME="xtreamium-proxy"
        USER_SERVICE_NAME="xtreamium-proxy-user"

        echo "Xtreamium Proxy Installer"
        echo "========================"
        echo
        echo "Choose installation type:"
        echo "1) System-wide service (requires sudo)"
        echo "2) User service (runs when user logs in)"
        read -p "Enter choice [1-2]: " choice

        case $choice in
            1)
                echo "Installing system-wide service..."

                # Create user and group
                sudo useradd -r -s /bin/false -d $INSTALL_DIR xtreamium || true

                # Create directory and copy files
                sudo mkdir -p $INSTALL_DIR
                sudo cp xtreamium-proxy $INSTALL_DIR/
                sudo cp -r * $INSTALL_DIR/ 2>/dev/null || true
                sudo chown -R xtreamium:xtreamium $INSTALL_DIR
                sudo chmod +x $INSTALL_DIR/xtreamium-proxy

                # Create log directory
                sudo mkdir -p /var/log/xtreamium-proxy
                sudo chown xtreamium:xtreamium /var/log/xtreamium-proxy

                # Install and enable service
                sudo cp xtreamium-proxy.service /etc/systemd/system/
                sudo systemctl daemon-reload
                sudo systemctl enable $SERVICE_NAME
                sudo systemctl start $SERVICE_NAME

                echo "System service installed and started successfully!"
                echo "Use 'sudo systemctl status $SERVICE_NAME' to check status"
                ;;
            2)
                echo "Installing user service..."

                # Create user directory and copy files
                mkdir -p $USER_INSTALL_DIR
                cp xtreamium-proxy $USER_INSTALL_DIR/
                cp -r * $USER_INSTALL_DIR/ 2>/dev/null || true
                chmod +x $USER_INSTALL_DIR/xtreamium-proxy

                # Create systemd user directory
                mkdir -p ~/.config/systemd/user

                # Install and enable user service
                cp xtreamium-proxy-user.service ~/.config/systemd/user/
                systemctl --user daemon-reload
                systemctl --user enable $USER_SERVICE_NAME
                systemctl --user start $USER_SERVICE_NAME

                # Enable lingering so service starts on boot
                sudo loginctl enable-linger $USER

                echo "User service installed and started successfully!"
                echo "Use 'systemctl --user status $USER_SERVICE_NAME' to check status"
                ;;
            *)
                echo "Invalid choice. Exiting."
                exit 1
                ;;
        esac
        EOF

        # Create uninstall script
        cat > ./publish/linux/uninstall.sh << 'EOF'
        #!/bin/bash

        SERVICE_NAME="xtreamium-proxy"
        USER_SERVICE_NAME="xtreamium-proxy-user"
        INSTALL_DIR="/opt/xtreamium-proxy"
        USER_INSTALL_DIR="$HOME/.local/opt/xtreamium-proxy"

        echo "Xtreamium Proxy Uninstaller"
        echo "==========================="
        echo
        echo "Choose uninstall type:"
        echo "1) System-wide service"
        echo "2) User service"
        read -p "Enter choice [1-2]: " choice

        case $choice in
            1)
                echo "Uninstalling system service..."
                sudo systemctl stop $SERVICE_NAME || true
                sudo systemctl disable $SERVICE_NAME || true
                sudo rm -f /etc/systemd/system/$SERVICE_NAME.service
                sudo systemctl daemon-reload
                sudo rm -rf $INSTALL_DIR
                sudo userdel xtreamium || true
                sudo rm -rf /var/log/xtreamium-proxy
                echo "System service uninstalled successfully!"
                ;;
            2)
                echo "Uninstalling user service..."
                systemctl --user stop $USER_SERVICE_NAME || true
                systemctl --user disable $USER_SERVICE_NAME || true
                rm -f ~/.config/systemd/user/$USER_SERVICE_NAME.service
                systemctl --user daemon-reload
                rm -rf $USER_INSTALL_DIR
                echo "User service uninstalled successfully!"
                ;;
            *)
                echo "Invalid choice. Exiting."
                exit 1
                ;;
        esac
        EOF

        # Create README
        cat > ./publish/linux/README.md << 'EOF'
        # Xtreamium Proxy Linux Service

        ## Installation
        1. Extract the package
        2. Run `chmod +x install.sh`
        3. Run `./install.sh`
        4. Choose installation type:
           - System-wide: Runs as system service (requires sudo)
           - User: Runs when user logs in (no sudo required)

        ## Uninstallation
        1. Run `chmod +x uninstall.sh`
        2. Run `./uninstall.sh`

        ## Manual Service Management

        ### System Service
        - Status: `sudo systemctl status xtreamium-proxy`
        - Start: `sudo systemctl start xtreamium-proxy`
        - Stop: `sudo systemctl stop xtreamium-proxy`
        - Logs: `sudo journalctl -u xtreamium-proxy -f`

        ### User Service
        - Status: `systemctl --user status xtreamium-proxy-user`
        - Start: `systemctl --user start xtreamium-proxy-user`
        - Stop: `systemctl --user stop xtreamium-proxy-user`
        - Logs: `journalctl --user -u xtreamium-proxy-user -f`

        ## Configuration
        Edit appsettings.json in the installation directory to configure the application.
        EOF

        # Make scripts executable
        chmod +x ./publish/linux/install.sh
        chmod +x ./publish/linux/uninstall.sh
        chmod +x ./publish/linux/xtreamium-proxy

    - name: Create Linux TAR package
      run: |
        cd ./publish/linux
        tar -czf ../../xtreamium-proxy-linux.tar.gz *

    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: xtreamium-proxy-linux
        path: ./xtreamium-proxy-linux.tar.gz

    - name: Upload DEB Package
      uses: actions/upload-artifact@v4
      with:
        name: xtreamium-proxy-deb
        path: ./publish/packages/*.deb

    - name: Upload RPM Package
      uses: actions/upload-artifact@v4
      with:
        name: xtreamium-proxy-rpm
        path: ./publish/packages/*.rpm

    - name: Upload Arch Package
      uses: actions/upload-artifact@v4
      with:
        name: xtreamium-proxy-arch
        path: ./publish/packages/*.pkg.tar.zst

    - name: Push to AUR
      if: github.event_name == 'release' && !contains(github.ref_name, 'preview')
      run: |
        # Setup SSH for AUR
        mkdir -p ~/.ssh
        echo "${{ secrets.AUR_SSH_KEY }}" > ~/.ssh/aur
        chmod 600 ~/.ssh/aur
        
        # Configure SSH for AUR
        cat >> ~/.ssh/config << 'EOF'
        Host aur.archlinux.org
          IdentityFile ~/.ssh/aur
          User aur
          StrictHostKeyChecking no
        EOF
        
        # Push to AUR
        cd scripts/packaging
        chmod +x push-to-aur.sh
        ./push-to-aur.sh
      env:
        VERSION: ${{ github.ref_name }}

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
    - name: Download Windows Installer
      uses: actions/download-artifact@v4
      with:
        name: xtreamium-proxy-windows-installer
        path: ./artifacts/windows

    - name: Download Linux Artifact
      uses: actions/download-artifact@v4
      with:
        name: xtreamium-proxy-linux
        path: ./artifacts/linux

    - name: Download DEB Package
      uses: actions/download-artifact@v4
      with:
        name: xtreamium-proxy-deb
        path: ./artifacts/deb

    - name: Download RPM Package
      uses: actions/download-artifact@v4
      with:
        name: xtreamium-proxy-rpm
        path: ./artifacts/rpm

    - name: Download Arch Package
      uses: actions/download-artifact@v4
      with:
        name: xtreamium-proxy-arch
        path: ./artifacts/arch

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ./artifacts/windows/*.exe
          ./artifacts/linux/*.tar.gz
          ./artifacts/deb/*.deb
          ./artifacts/rpm/*.rpm
          ./artifacts/arch/*.pkg.tar.zst
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
