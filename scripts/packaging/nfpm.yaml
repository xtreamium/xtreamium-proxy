# nfpm configuration for xtreamium-proxy
# https://nfpm.goreleaser.com/
#
# This packages xtreamium-proxy as a per-user systemd service. The binary lives
# in /usr/bin so any user on the system can run it, but the service identity is
# always the desktop user (via `systemctl --user`). No system user is created,
# no files are written under /etc, /opt, or /var.

name: "xtreamium-proxy"
arch: "amd64"
platform: "linux"
version: "${VERSION}"
section: "default"
priority: "optional"
maintainer: "Xtreamium <support@xtreamium.com>"
description: |
  Xtreamium Proxy - A streaming proxy service
  A modern streaming proxy built with .NET 9, run as a per-user systemd service.
vendor: "Xtreamium"
homepage: "https://github.com/xtreamium/xtreamium-proxy"
license: "MIT"

depends:
  - ffmpeg

recommends:
  - mpv

contents:
  - src: "../../publish/linux/xtreamium-proxy"
    dst: "/usr/bin/xtreamium-proxy"
    file_info:
      mode: 0755

  - src: "../../publish/linux/appsettings.json"
    dst: "/usr/share/xtreamium-proxy/appsettings.json.example"
    file_info:
      mode: 0644

  - src: "../../publish/linux/xtreamium-proxy.service"
    dst: "/usr/lib/systemd/user/xtreamium-proxy.service"
    file_info:
      mode: 0644

scripts:
  postinstall: ./scripts/postinstall.sh
  postremove: ./scripts/postremove.sh

overrides:
  deb:
    depends:
      - ffmpeg
    recommends:
      - mpv
  rpm:
    depends:
      - ffmpeg
    recommends:
      - mpv
  archlinux:
    depends:
      - ffmpeg

rpm:
  group: "Applications/Internet"
  summary: "Xtreamium Proxy - A streaming proxy service"
  compression: lzma

deb:
  fields:
    Bugs: "https://github.com/xtreamium/xtreamium-proxy/issues"

archlinux:
  pkgbase: "xtreamium-proxy"
  packager: "Xtreamium <support@xtreamium.com>"
